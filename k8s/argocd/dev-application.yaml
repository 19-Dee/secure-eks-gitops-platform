apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-dev
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  project: default
  source:
    repoURL: https://github.com/19-Dee/secure-eks-gitops-platform.git
    targetRevision: feat/eks
    path: k8s/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
