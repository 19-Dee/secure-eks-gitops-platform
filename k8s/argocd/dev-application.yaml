apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-dev
  namespace: argocd
spec:
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: portfolio-deployment
      namespace: dev
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
  project: default
  source:
    repoURL: https://github.com/19-Dee/secure-eks-gitops-platform.git
    targetRevision: feat/eks
    path: k8s/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
